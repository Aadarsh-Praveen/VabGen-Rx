services:
  - type: web
    name: vabgenrx-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT api.app:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUDIT_DATABASE_URL
        sync: false
      - key: AUDIT_ADMIN_DATABASE_URL
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: FDA_API_KEY
        sync: false

  - type: web
    name: vabgenrx-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      # Render injects PORT automatically — server/index.js already reads
      # process.env.PORT, so it isn't set here.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PROFILE_IMAGES_BUCKET
        value: profile-images
      - key: VOICE_NOTES_BUCKET
        value: voice-notes
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
